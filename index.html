<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Fhed Web</title>
<link rel="stylesheet" href="First_Style.css">
</head>
<body>
  <div class="container">
    <h1>Welcome to My Website</h1>
    <p>i bought this for 1 dollar</p>
  </div>
  // tung tung sahur

  <div class="carousel">
    <div class="track" id="track">
      <div class="slide">
        <div class="card-profile">
          <img src="image/New_Photo.jpeg" alt="Photo">
          <p><strong>Hello this is me</strong></p>
          <p><strong>Name: Fhedroe</strong></p>
          <p><strong>Age: 45</strong></p>
        </div>
      </div>

      <div class="slide">
        <div class="card">
          <h2><strong>My Other Account</strong>
            <ul>
                <li><a href="https://steamcommunity.com/profiles/76561199154250229/">Steam</a></li>
                <li><a href="https://gvjhvhvuj.itch.io/">Itch.io</a></li>
                <li><a href="https://github.com/RizzlesSigma">GitHub</a></li>
                <li><a href="https://www.instagram.com/fhedro3243/">Instagram</a></li>
            </ul>
          </h2>
        </div>
      </div>

      <div class="slide">
        <div class="card">
          <h2><strong>Project Public</strong>
            <ul>
                <li><a href="https://github.com/RizzlesSigma/Simple_Website/releases/download/PDF_Editor/PDF_Editor.exe" download="PDF_Editor.exe">PDF Editor</a></li>
            </ul>
          </h2>
        </div>
      </div>
    </div>

    <button class="btn prev" onclick="move(-1)">‹</button>
    <button class="btn next" onclick="move(1)">›</button>
    <div class="dots"  id="dots"></div>
  </div>

  <div class="footer">
    <p>&copy; 2026 Fhed Website. All rights reserved.</p>
  </div>

  <script>
      const track = document.getElementById('track');
      const dotsContainer = document.getElementById('dots');
      const totalSlides = track.children.length;
      let index = 0;

      // build dots dynamically
      for (let i = 0; i < totalSlides; i++) {
          const dot = document.createElement('button');
          dot.classList.add('dot');
          if (i === 0) dot.classList.add('active');
          dot.addEventListener('click', () => goTo(i));
          dotsContainer.appendChild(dot);
      }
      const dots = document.querySelectorAll('.dot');

      function updateDots() {
          dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
      }

      function goTo(i) {
          index = (i + totalSlides) % totalSlides;
          track.style.transform = `translateX(-${index * 100}%)`;
          updateDots();
      }

      function move(direction) {
          goTo(index + direction);
      }

      // keyboard arrow support
      document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') move(-1);
          if (e.key === 'ArrowRight') move(1);
      });

      // swipe support (touch)
      let startX = 0;
      let isDragging = false;

      track.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          isDragging = true;
      });

      track.addEventListener('touchend', (e) => {
          if (!isDragging) return;
          const endX = e.changedTouches[0].clientX;
          const diff = startX - endX;
          const threshold = 40; // minimum px swipe distance to trigger a move

          if (diff > threshold) move(1);       // swiped left → next
          else if (diff < -threshold) move(-1); // swiped right → prev

          isDragging = false;
      });
  </script>

</body>
</html>
